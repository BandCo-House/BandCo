name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: bandco-be
  BUILD_CONTEXT: ./backend
  DOCKERFILE_PATH: ./backend/Dockerfile
  CONTAINER_NAME: bandco-nest
  CONTAINER_PORT: 3000
  HOST_PORT: ${{ vars.BACKEND_HOST_PORT || '3000' }}
  AWS_REGION: ap-northeast-2
  BACKEND_SECRET_ID: bandco/prod/backend

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load backend environment
        id: backend-env
        shell: bash
        run: |
          set -euo pipefail

          secret_json="$(aws secretsmanager get-secret-value \
            --secret-id "$BACKEND_SECRET_ID" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text)"

          jq -e '
            type == "object" and
            has("DATABASE_URL") and
            has("JWT_SECRET") and
            has("BCRYPT_SALT_ROUNDS") and
            has("AWS_REGION") and
            has("AWS_STORAGE_BUCKET")
          ' <<< "$secret_json" > /dev/null

          backend_env="$(jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"' <<< "$secret_json")"
          backend_env_base64="$(printf '%s\n' "$backend_env" | base64 -w 0)"

          echo "::add-mask::$backend_env_base64"
          echo "content=$backend_env_base64" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          BACKEND_ENV_BASE64: ${{ steps.backend-env.outputs.content }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,BACKEND_ENV_BASE64
          script: |
            set -e

            TEMP_ENV_FILE=/home/ubuntu/.env.tmp
            ENV_FILE=/home/ubuntu/.env

            printf '%s' "$BACKEND_ENV_BASE64" | base64 --decode > "$TEMP_ENV_FILE"
            chmod 600 "$TEMP_ENV_FILE"
            mv "$TEMP_ENV_FILE" "$ENV_FILE"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE"

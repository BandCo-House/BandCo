services:
  backend:
    image: node:24.13.1
    container_name: jamplay_backend
    env_file:
      - ./backend/.env.development
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app
    command: >
      sh -c "
      corepack enable &&
      pnpm install --force &&
      pnpm run start:dev
      "
    networks:
      - jamplay_network
  frontend:
    image: node:22
    container_name: jamplay_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --force && pnpm run dev"
    networks:
      - jamplay_network
networks:
  jamplay_network:
    driver: bridge
volumes:
  backend_node_modules:
  frontend_node_modules:

services:
  db:
    image: postgres:16.13
    container_name: jamplay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - jamplay_network
  backend:
    image: node:24
    container_name: jamplay_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    working_dir: /app
    command: sh -c "corepack enable &&pnpm install && pnpm run start:dev"
    networks:
      - jamplay_network
  frontend:
    image: node:24
    container_name: jamplay_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    networks:
      - jamplay_network
networks:
  jamplay_network:
    driver: bridge
volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
